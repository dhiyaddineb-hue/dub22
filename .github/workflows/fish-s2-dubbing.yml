name: Fish S2 Pro Arabic Dubbing

on:
  workflow_dispatch:
    inputs:
      input_video:
        description: Repository-relative input video path
        required: true
        default: assets/input/new_job/source.mp4
      manifest:
        description: Repository-relative Fish S2 manifest path
        required: true
        default: manifests/new_job/dialogue_ar_fish_s2.json
      output_name:
        description: Output filename
        required: true
        default: arabic_dub_fish_s2_pro.mp4

permissions:
  contents: read

jobs:
  dub:
    name: Run Fish Audio S2 Pro on GPU
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Verify GPU
        run: |
          nvidia-smi
          python3 - <<'PY'
          import torch
          assert torch.cuda.is_available(), 'A CUDA-enabled GPU runner is required.'
          print(torch.cuda.get_device_name(0))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Clone Fish Speech runtime
        run: |
          git clone --depth 1 https://github.com/fishaudio/fish-speech.git vendor/fish-speech
          cd vendor/fish-speech
          uv sync --extra cu126 --no-dev

      - name: Download S2 Pro weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p vendor/fish-speech/checkpoints/s2-pro
          if [ -n "$HF_TOKEN" ]; then
            vendor/fish-speech/.venv/bin/hf download fishaudio/s2-pro --local-dir vendor/fish-speech/checkpoints/s2-pro --token "$HF_TOKEN"
          else
            vendor/fish-speech/.venv/bin/hf download fishaudio/s2-pro --local-dir vendor/fish-speech/checkpoints/s2-pro
          fi

      - name: Run Arabic dubbing
        env:
          PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        run: |
          mkdir -p outputs/github
          vendor/fish-speech/.venv/bin/python scripts/fish_s2_dub.py \
            --input "${{ inputs.input_video }}" \
            --manifest "${{ inputs.manifest }}" \
            --output "outputs/github/${{ inputs.output_name }}" \
            --fish-root vendor/fish-speech \
            --python vendor/fish-speech/.venv/bin/python \
            --checkpoint checkpoints/s2-pro \
            --workdir assets/fish_s2/github \
            --device cuda \
            --temperature 0.75 \
            --top-p 0.85 \
            --max-new-tokens 1400

      - name: Validate output
        run: |
          test -s "outputs/github/${{ inputs.output_name }}"
          ffmpeg -v error -i "outputs/github/${{ inputs.output_name }}" -f null -
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type -of default=noprint_wrappers=1 "outputs/github/${{ inputs.output_name }}"

      - name: Upload dubbed video artifact
        uses: actions/upload-artifact@v4
        with:
          name: fish-s2-arabic-dubbing
          path: outputs/github/${{ inputs.output_name }}
          retention-days: 14
