[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dub22"
version = "0.1.0"
description = "Professional Arabic video dubbing workspace"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
dub22 = "scripts.dub22:main"

[tool.setuptools.packages.find]
include = ["scripts*"]
